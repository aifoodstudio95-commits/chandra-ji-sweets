<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chandra Ji Sweets</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fffaf0;color:#211817}
header{position:sticky;top:0;z-index:99;background:#17151a;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:20px;font-weight:bold}.logo span{color:#f5c542}.logo small{display:block;font-size:10px;color:#ddd}
nav{display:flex;gap:15px}nav a{color:#fff;text-decoration:none;font-size:14px}
.btn{border:0;border-radius:25px;padding:11px 16px;font-weight:bold;cursor:pointer;display:inline-block;text-decoration:none}
.red{background:#e51b3e;color:#fff}.green{background:#12a95a;color:#fff}.gold{background:#f5c542;color:#211817}.dark{background:#222;color:#fff}
.hero{background:linear-gradient(90deg,#160b08ee,#160b0860),linear-gradient(135deg,#6d1d0d,#d99b24,#35120b);color:#fff;padding:65px 18px}
.heroBox{max-width:1100px;margin:auto}.badge{display:inline-block;background:#f5c542;color:#3b2500;padding:7px 13px;border-radius:20px;font-weight:bold}
h1{font-size:clamp(42px,8vw,72px);margin:15px 0}.hero h1 span{color:#f5c542}
.hero p{font-size:17px;max-width:650px}.rating{color:#ffd22f;font-weight:bold;font-size:18px}
.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.categories{background:#fff;padding:15px}.categoryBox{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.category{text-align:center;padding:10px;border-radius:15px;font-weight:bold;text-decoration:none;color:#222}.category:hover{background:#fff0bd}
.emoji{font-size:32px;display:block}
section{max-width:1150px;margin:auto;padding:38px 16px}.title{font-size:30px;margin-bottom:5px}.subtitle{color:#746b68;margin-bottom:20px}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:#fff;border:1px solid #eadfd8;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px #0000000d}
